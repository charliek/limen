# =============================================================================
# Documentation style
# =============================================================================
# - Professional, direct tone (no marketing language)
# - Tables for CLI options, config fields, metrics
# - Code blocks with language hints (bash, yaml, rust)
# - Admonitions sparingly (important notes / warnings only)
# - Examples should be copy-pasteable
# - One topic per page; keep pages focused
# =============================================================================

site_name: Limen
site_description: 'A reverse proxy for safely migrating HTTP traffic from a legacy service to a new implementation'
site_author: 'Limen Contributors'
site_url: 'https://charliek.github.io/limen/'

repo_name: charliek/limen
repo_url: https://github.com/charliek/limen
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site-build

dev_addr: '127.0.0.1:7071'

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/swap-horizontal-bold

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# The nav grows phase by phase so the published site never references a page
# that does not exist yet. Guides and detailed references are added in the phase
# that implements the feature they describe.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Comparison & Contracts: guides/comparison-and-contracts.md
      - Flags & Rollout: guides/flags-and-rollout.md
      - Resilience & Failover: guides/resilience.md
      - Observability & Operations: guides/observability.md
  - Reference:
      - Architecture: reference/architecture.md
      - CLI: reference/cli.md
      - Configuration: reference/config-reference.md
      - Contract: reference/contract-reference.md
  - Development:
      - Setup: development/setup.md
      - Testing: development/testing.md
  - Specifications:
      - Limen Spec: limen_spec.md
      - Migration Runbook: runbook.md
      - PR/FAQ: prfaq.md
      - Pharos Spec: pharos_spec.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/charliek/limen
