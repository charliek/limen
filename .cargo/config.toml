# Pin the toolchain via rust-toolchain.toml / .mise.toml but let cargo pick
# dependency versions that actually support it: prefer rust-version-compatible
# releases, falling back to newer ones only when nothing else satisfies the
# graph. Without this the edition-2021 (v2) resolver can grab transitive crates
# that require a newer rustc than we pin.
[resolver]
incompatible-rust-versions = "fallback"
