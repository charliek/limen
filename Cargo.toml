[package]
name = "limen"
# 0.0.0 is a pre-release sentinel: limen has never published a release. The
# first tagged release moves this to a real version.
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
description = "A production-grade reverse proxy for safely migrating HTTP traffic from a legacy service to a new implementation"
license = "MIT"
repository = "https://github.com/charliek/limen"
authors = ["Charlie Knudsen"]
default-run = "limen"

[lib]
name = "limen"
path = "src/lib.rs"

[[bin]]
name = "limen"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (data plane + control plane). The `http` crate's types are used
# via axum's `axum::http` re-export, so it is not a direct dependency — this
# also avoids the collision with our own `http` module (Section 3.5).
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
bytes = "1"

# Upstream HTTP client (primary + shadow calls). `rustls` is reqwest 0.13's
# rename of 0.12's `rustls-tls`: rustls with the aws-lc-rs provider, verifying
# against the OS trust store (no bundled Mozilla roots), so a runtime image
# needs `ca-certificates`.
reqwest = { version = "0.13", default-features = false, features = [
    "stream",
    "rustls",
] }

# The one rustls crypto provider in this binary is aws-lc-rs, named here so it
# is a decision made in this manifest and not an accident of whichever crate
# happens to enable it. Two providers in one build make every
# `rustls::ClientConfig::builder()` that leans on the crate-feature default
# (redis-rs' `rediss://` connect is one) panic at runtime, on a TLS connect no
# plain-`redis://` test reaches. `main` installs the aws-lc-rs provider
# explicitly, and CI's "Guard: rustls has one provider" steps fail if ring
# comes back in any graph (build or dev).
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }

# Shared StrideLabs HTTP primitives. The `proxy` feature is where limen's own
# mechanical layer went when it was extracted upstream — header filtering,
# upstream-URL construction, bounded body buffering, `X-Forwarded-*` synthesis,
# the pooled upstream client — so limen now consumes what it exported instead
# of maintaining a second copy. Everything limen layers *on top* of that
# (the `x-limen-*` strips, the config-shaped client build, the listener scheme)
# stays here, in thin wrappers over these calls.
#
# Pinned to a tag, not a branch — but the committed Cargo.lock rev is the
# actual supply-chain pin (a tag is a mutable ref; the lock is not). The tag
# names the intent, the lock enforces it, and bumping either is a deliberate
# edit reviewed here.
#
# TEMPORARY: a commit rev, not the tag. reqwest 0.13 (and with it the shared
# client's types) is in v0.5.0, which is not tagged yet; this is the head of the
# branch that becomes it. The next commit re-pins to `tag = "v0.5.0"`.
stridelabs-http = { git = "https://github.com/charliek/stridelabs-rust.git", rev = "9233c447e46426bd26634efe49b89490806709ce", default-features = false, features = [
    "proxy",
] }

# Config / contract serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
serde_path_to_error = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# CLI / errors
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"

# Comparison + rollout
blake3 = "1"
async-trait = "0.1"
futures = "0.3"
rand = "0.10"
url = "2"
# RFC3339 parsing for timestamp normalization (convert to UTC before truncating);
# formatting for the diff sink's record timestamps and daily file names.
time = { version = "0.3", features = ["parsing", "formatting"] }

# Redis flag provider (async; cached + polled). `redis` is the more ubiquitous
# of the two options in the spec; the provider sits behind the FlagProvider
# trait so a remote provider can replace it later. rustls TLS so `rediss://`
# URLs (which config validation accepts) actually connect. redis 1.x's
# `tokio-rustls-comp` selects no crypto provider of its own (0.27's
# `tls-rustls` forced `rustls/ring`); the provider is the `rustls` entry
# above.
redis = { version = "1", features = [
    "tokio-comp",
    "connection-manager",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# Also normal deps, but integration-test crates need them in scope to drive the
# proxy router directly and parse test configs.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
yaml_serde = "0.10"
# The `log` -> `tracing` bridge `LogCapture` installs, so a dependency's `log::`
# records (reqwest's) land in the captured text as they do in production.
# Already in the graph through tracing-subscriber's default `tracing-log`.
tracing-log = "0.2"
# Criterion for the proxy-overhead benchmarks (lean: no plotters/rayon).
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "proxy_overhead"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
# `line-tables-only` over `limited`: backtraces still name the function and
# line, which is all this crate's debugging ever needs, at a fraction of the
# debug-info size.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies are not stepped through; their debug info is pure disk. This is
# the load-bearing line — dependency debug info is the bulk of `target/debug`.
debug = false
