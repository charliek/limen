[package]
name = "limen"
# 0.0.0 is a pre-release sentinel: limen has never published a release. The
# first tagged release moves this to a real version.
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
description = "A production-grade reverse proxy for safely migrating HTTP traffic from a legacy service to a new implementation"
license = "MIT"
repository = "https://github.com/charliek/limen"
authors = ["Charlie Knudsen"]
default-run = "limen"

[lib]
name = "limen"
path = "src/lib.rs"

[[bin]]
name = "limen"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (data plane + control plane). The `http` crate's types are used
# via axum's `axum::http` re-export, so it is not a direct dependency — this
# also avoids the collision with our own `http` module (Section 3.5).
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
bytes = "1"

# Upstream HTTP client (primary + shadow calls)
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "rustls-tls-native-roots",
] }

# Config / contract serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_path_to_error = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }

# CLI / errors
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
anyhow = "1"

# Comparison + rollout
blake3 = "1"
async-trait = "0.1"
futures = "0.3"
rand = "0.9"
url = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "limited"
