# Example Limen configuration.
#
# Validate it with:  limen validate-config -c config/limen.example.yaml
# Inspect routes:    limen print-routes    -c config/limen.example.yaml
#
# Configuration is layered (spec §5.1): built-in defaults < this file <
# environment (LIMEN_*) < CLI flags.

server:
  listen_addr: "0.0.0.0:8080" # data plane (proxied client traffic)
  graceful_shutdown_timeout_ms: 10000
  request_body_limit_bytes: 1048576 # hard cap on buffered request bodies

metrics:
  listen_addr: "0.0.0.0:9090" # control plane: /metrics, /health/*
  path: "/metrics"

upstream_tls:
  verify_certificates: true
  ca_bundle_path: null # optional custom CA bundle for internal PKI

flags:
  provider: "file" # static | file | redis
  file:
    path: "./flags.local.yaml"
    refresh_interval_ms: 1000
  stale_ttl_ms: 30000 # after this, apply fail_safe_mode
  fail_safe_mode: "legacy_only"

# Optional durable mismatch sink (spec §10.4). Uncomment to append every
# comparison mismatch to <dir>/mismatches-<UTC date>.jsonl, on top of the usual
# metrics and log line. Read it back with `limen report --dir ./limen-diffs`.
# The directory is created on the first mismatch; retention is yours.
# diff_sink:
#   dir: "./limen-diffs"

routes:
  # A read being observed in shadow mode: legacy serves the client, new is
  # shadowed, responses are compared using the referenced contract.
  - id: "get-device"
    match:
      methods: ["GET"]
      path_prefix: "/devices/"
    legacy_upstream: "https://legacy-device.internal"
    new_upstream: "https://new-device.internal"
    mode: "shadow_legacy_primary"
    contract: "./contracts/example-service.contract.yaml#get-device"
    timeouts:
      primary_ms: 2000
      shadow_ms: 2000
    comparison:
      enabled: true
      sample_rate: 0.1 # buffer + compare ~10% of eligible reads
      max_body_bytes: 262144
      # shadow_methods: ["POST"]  # opt a write method into shadowing (spec
      #   §6.1); only valid on shadow_legacy_primary routes, and the method
      #   must also appear in match.methods
    circuit_breaker:
      enabled: true
      failure_rate_threshold: 0.25
      min_requests: 20
      open_duration_ms: 30000
      half_open_max_requests: 5
    budget:
      max_new_p95_latency_ratio: 1.0
      max_new_error_rate_ratio: 1.0
      max_mismatch_rate: 0.001

  # A list endpoint mid-rollout: deterministic per-tenant split, raised at
  # runtime via the rollout flag.
  - id: "list-devices"
    match:
      methods: ["GET"]
      path_prefix: "/devices"
    legacy_upstream: "https://legacy-device.internal"
    new_upstream: "https://new-device.internal"
    mode: "percentage_split"
    contract: "./contracts/example-service.contract.yaml#list-devices"
    rollout:
      percentage_flag: "migration.list-devices.rollout_percentage"
      default_percentage: 0
      assignment_key:
        header: "x-tenant-id"
        fallback: "request_random"
    timeouts:
      primary_ms: 2000
      shadow_ms: 2000
    comparison:
      enabled: true
      sample_rate: 0.05
      max_body_bytes: 524288

  # A write moved via percentage split (never shadowed): each request goes to
  # exactly one implementation, so the side effect is never doubled.
  - id: "create-device"
    match:
      methods: ["POST"]
      path_prefix: "/devices"
    legacy_upstream: "https://legacy-device.internal"
    new_upstream: "https://new-device.internal"
    mode: "percentage_split"
    contract: "./contracts/example-service.contract.yaml#create-device"
    rollout:
      percentage_flag: "migration.create-device.rollout_percentage"
      default_percentage: 0
      assignment_key:
        header: "x-tenant-id"
        fallback: "request_random"

  # One path, two kinds of traffic (spec §5.2). An OAuth authorize endpoint
  # serves both the initial browser bounce — safely comparable — and the
  # login/consent hops, which replay one-time verifier tokens: the shadow's copy
  # of a verifier deterministically fails at the shared authorization server
  # ("The consent verifier has already been used"), so those hops must be
  # relayed, never shadowed. `query_present` / `query_absent` split them without
  # giving up comparison on the bounces.
  #
  # Two query-conditioned routes on the same prefix must be *provably disjoint*
  # (spec §5.3): some parameter appears in one route's `query_present` and the
  # other's `query_absent`. That holds pairwise here, and between them the three
  # routes cover every request — including one carrying both verifiers, which the
  # first route takes.
  - id: "oauth-login-hop"
    match:
      methods: ["GET"]
      path_prefix: "/oauth2/auth"
      query_present: ["login_verifier"] # AND across the list; values ignored
    legacy_upstream: "https://legacy-device.internal"
    mode: "legacy_only" # relay only: a one-time token cannot be replayed

  - id: "oauth-consent-hop"
    match:
      methods: ["GET"]
      path_prefix: "/oauth2/auth"
      query_present: ["consent_verifier"]
      query_absent: ["login_verifier"]
    legacy_upstream: "https://legacy-device.internal"
    mode: "legacy_only"

  # The comparable traffic. The `query_absent` guard is redundant with matching
  # — a query-conditioned route already wins the tie on an equal prefix — but
  # stating it keeps "this route never sees a verifier" true locally, where the
  # comparison is switched on.
  - id: "oauth-authorize"
    match:
      methods: ["GET"]
      path_prefix: "/oauth2/auth"
      query_absent: ["login_verifier", "consent_verifier"] # none may be present
    legacy_upstream: "https://legacy-device.internal"
    new_upstream: "https://new-device.internal"
    mode: "shadow_legacy_primary"
    comparison:
      enabled: true
      sample_rate: 0.1

  # A health endpoint with no legacy equivalent: served only by the new service.
  - id: "health"
    match:
      methods: ["GET"]
      path_prefix: "/health"
    new_upstream: "https://new-device.internal"
    mode: "new_only"
